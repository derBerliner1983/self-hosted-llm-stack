<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 940" width="1600" height="940" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif">
  <title>Self-Hosted AI Stack — kompletter KI-Stack auf eigener AMD-Hardware, ein Befehl</title>

  <defs>
    <linearGradient id="aiGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#2563eb"/>
      <stop offset="55%"  stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#c026d3"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="940" rx="28" fill="#ffffff"/>

  <!-- ── Titel ─────────────────────────────────────────────────────────── -->
  <g text-anchor="middle">
    <text x="800" y="112" font-size="76" font-weight="800" fill="#0b1220" letter-spacing="-1.5">
      Self-Hosted <tspan fill="url(#aiGrad)">AI</tspan> Stack
    </text>
    <text x="800" y="166" font-size="30" font-weight="600" fill="#64748b">
      Kompletter KI-Stack auf eigener Hardware — <tspan fill="#2563eb" font-weight="700">ein Befehl</tspan>, AMD ROCm, keine Cloud
    </text>
  </g>

  <!-- Deko-Funken -->
  <g fill="#a5b4fc">
    <path d="M170 74 l9 22 22 9 -22 9 -9 22 -9 -22 -22 -9 22 -9z"/>
    <path d="M1432 66 l7 17 17 7 -17 7 -7 17 -7 -17 -17 -7 17 -7z" fill="#7c3aed"/>
    <path d="M1476 128 l6 14 14 6 -14 6 -6 14 -6 -14 -14 -6 14 -6z" fill="#22d3ee"/>
    <path d="M126 140 l6 14 14 6 -14 6 -6 14 -6 -14 -14 -6 14 -6z" fill="#38bdf8"/>
  </g>

  <!-- ── Hauptfluss: Nutzer → Open WebUI → LiteLLM → Ollama ────────────── -->
  <g>
    <!-- Nutzer -->
    <circle cx="128" cy="300" r="52" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
    <g stroke="#334155" stroke-width="4" fill="none" stroke-linecap="round">
      <circle cx="128" cy="286" r="15"/>
      <path d="M104 324c4-14 13-21 24-21s20 7 24 21"/>
    </g>
    <text x="128" y="386" text-anchor="middle" font-size="22" font-weight="600" fill="#334155">Du</text>

    <!-- Pfeil 1 -->
    <g stroke="#0f172a" stroke-width="4" fill="none">
      <path d="M196 300 h44"/>
      <path d="M234 292 l12 8 -12 8z" fill="#0f172a" stroke="none"/>
    </g>

    <!-- Open WebUI -->
    <rect x="262" y="242" width="342" height="116" rx="20" fill="#faf5ff" stroke="#a855f7" stroke-width="2.5"/>
    <g transform="translate(300,272)">
      <rect x="0" y="6" width="46" height="38" rx="9" fill="#7c3aed"/>
      <circle cx="14" cy="23" r="5" fill="#ffffff"/>
      <circle cx="32" cy="23" r="5" fill="#ffffff"/>
      <path d="M23 0 v7" stroke="#7c3aed" stroke-width="4" stroke-linecap="round"/>
      <circle cx="23" cy="-2" r="4" fill="#7c3aed"/>
    </g>
    <text x="370" y="292" font-size="30" font-weight="700" fill="#0b1220">Open WebUI</text>
    <text x="370" y="322" font-size="19" fill="#64748b">Chat-Oberfläche</text>

    <!-- Pfeil 2 -->
    <g stroke="#0f172a" stroke-width="4" fill="none">
      <path d="M622 300 h44"/>
      <path d="M660 292 l12 8 -12 8z" fill="#0f172a" stroke="none"/>
    </g>

    <!-- LiteLLM -->
    <rect x="688" y="242" width="326" height="116" rx="20" fill="#f0fdf4" stroke="#22c55e" stroke-width="2.5"/>
    <g transform="translate(724,268)" stroke="#16a34a" stroke-width="4" fill="none">
      <circle cx="23" cy="8" r="7" fill="#ffffff"/>
      <circle cx="7"  cy="40" r="7" fill="#ffffff"/>
      <circle cx="39" cy="40" r="7" fill="#ffffff"/>
      <path d="M21 15 L10 33 M25 15 L36 33"/>
    </g>
    <text x="792" y="292" font-size="30" font-weight="700" fill="#0b1220">LiteLLM</text>
    <text x="792" y="322" font-size="19" fill="#64748b">AI-Gateway · Keys &amp; Limits</text>

    <!-- Pfeil 3 -->
    <g stroke="#0f172a" stroke-width="4" fill="none">
      <path d="M1032 300 h44"/>
      <path d="M1070 292 l12 8 -12 8z" fill="#0f172a" stroke="none"/>
    </g>

    <!-- Ollama -->
    <rect x="1098" y="242" width="374" height="116" rx="20" fill="#eff6ff" stroke="#3b82f6" stroke-width="2.5"/>
    <g transform="translate(1134,268)">
      <rect x="4" y="10" width="40" height="34" rx="12" fill="none" stroke="#2563eb" stroke-width="4"/>
      <path d="M13 12 C11 0 21 0 20 10" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
      <path d="M35 12 C37 0 27 0 28 10" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
      <circle cx="18" cy="28" r="3.5" fill="#2563eb"/>
      <circle cx="30" cy="28" r="3.5" fill="#2563eb"/>
    </g>
    <text x="1202" y="292" font-size="30" font-weight="700" fill="#0b1220">Ollama</text>
    <text x="1202" y="322" font-size="19" fill="#64748b">LLM-Engine · AMD ROCm</text>
  </g>

  <!-- ── Werkzeuge / MCP ──────────────────────────────────────────────── -->
  <rect x="60" y="424" width="1480" height="132" rx="22" fill="#fbfdff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="90" y="458" font-size="17" font-weight="700" fill="#94a3b8" letter-spacing="1.2">WERKZEUGE FÜRS MODELL (MCP)</text>

  <g font-size="20" font-weight="700" fill="#0b1220">
    <!-- Dateisystem / Vault -->
    <g transform="translate(96,484)">
      <path d="M2 8 h14 l5 6 h21 a4 4 0 0 1 4 4 v22 a4 4 0 0 1 -4 4 H2 a4 4 0 0 1 -4 -4 V12 a4 4 0 0 1 4 -4z" fill="none" stroke="#f59e0b" stroke-width="3.5"/>
      <text x="62" y="24" font-size="20">Wissens-Vault</text>
      <text x="62" y="46" font-size="16" font-weight="500" fill="#64748b">Obsidian · Dateien lesen/schreiben</text>
    </g>
    <line x1="410" y1="486" x2="410" y2="540" stroke="#e2e8f0" stroke-width="2"/>

    <!-- Code-Sandbox -->
    <g transform="translate(438,484)">
      <path d="M12 2 v14 L-1 40 a5 5 0 0 0 4 8 h30 a5 5 0 0 0 4 -8 L24 16 V2" fill="none" stroke="#8b5cf6" stroke-width="3.5" stroke-linejoin="round"/>
      <path d="M9 2 h18" stroke="#8b5cf6" stroke-width="3.5" stroke-linecap="round"/>
      <text x="58" y="24" font-size="20">Code-Sandbox</text>
      <text x="58" y="46" font-size="16" font-weight="500" fill="#64748b">Python · Shell · Java · Go · pwsh</text>
    </g>
    <line x1="770" y1="486" x2="770" y2="540" stroke="#e2e8f0" stroke-width="2"/>

    <!-- Android -->
    <g transform="translate(798,484)">
      <rect x="0" y="6" width="38" height="34" rx="7" fill="none" stroke="#22c55e" stroke-width="3.5"/>
      <path d="M8 6 L4 -2 M30 6 L34 -2" stroke="#22c55e" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="12" cy="19" r="3" fill="#22c55e"/>
      <circle cx="26" cy="19" r="3" fill="#22c55e"/>
      <text x="56" y="24" font-size="20">Android-Build</text>
      <text x="56" y="46" font-size="16" font-weight="500" fill="#64748b">Gradle · SDK · APK bauen</text>
    </g>
    <line x1="1100" y1="486" x2="1100" y2="540" stroke="#e2e8f0" stroke-width="2"/>

    <!-- Web + Zeit -->
    <g transform="translate(1128,484)">
      <circle cx="19" cy="23" r="19" fill="none" stroke="#ef4444" stroke-width="3.5"/>
      <path d="M19 12 v12 l8 6" fill="none" stroke="#ef4444" stroke-width="3.5" stroke-linecap="round"/>
      <text x="56" y="24" font-size="20">Web-Fetch &amp; Zeit</text>
      <text x="56" y="46" font-size="16" font-weight="500" fill="#64748b">Seiten abrufen · Zeitzonen exakt</text>
    </g>
  </g>

  <!-- ── Befehl ───────────────────────────────────────────────────────── -->
  <rect x="60" y="590" width="1480" height="120" rx="22" fill="url(#barGrad)"/>
  <text x="800" y="666" text-anchor="middle" font-size="52" font-weight="700"
        font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" fill="#ffffff">
    <tspan fill="#4ade80">$</tspan> ./install.sh
  </text>

  <!-- ── Eigenschaften ────────────────────────────────────────────────── -->
  <rect x="60" y="744" width="1480" height="136" rx="22" fill="#fbfdff" stroke="#e2e8f0" stroke-width="2"/>
  <g font-size="20" font-weight="700" fill="#0b1220">
    <!-- Selbst gehostet -->
    <g transform="translate(96,782)">
      <rect x="0" y="2" width="40" height="16" rx="4" fill="none" stroke="#2563eb" stroke-width="3.5"/>
      <rect x="0" y="26" width="40" height="16" rx="4" fill="none" stroke="#2563eb" stroke-width="3.5"/>
      <circle cx="9" cy="10" r="2.5" fill="#2563eb"/>
      <circle cx="9" cy="34" r="2.5" fill="#2563eb"/>
      <text x="58" y="16" font-size="20">Selbst gehostet</text>
      <text x="58" y="40" font-size="16" font-weight="500" fill="#64748b">Läuft auf deinem Server</text>
    </g>
    <line x1="386" y1="784" x2="386" y2="842" stroke="#e2e8f0" stroke-width="2"/>

    <!-- Privat -->
    <g transform="translate(414,782)">
      <rect x="2" y="16" width="34" height="26" rx="5" fill="none" stroke="#16a34a" stroke-width="3.5"/>
      <path d="M10 16 v-6 a9 9 0 0 1 18 0 v6" fill="none" stroke="#16a34a" stroke-width="3.5"/>
      <text x="56" y="16" font-size="20">Privat</text>
      <text x="56" y="40" font-size="16" font-weight="500" fill="#64748b">Daten bleiben lokal</text>
    </g>
    <line x1="704" y1="784" x2="704" y2="842" stroke="#e2e8f0" stroke-width="2"/>

    <!-- GPU -->
    <g transform="translate(732,782)">
      <path d="M19 0 c9 10 14 18 14 26 a14 14 0 0 1 -28 0 c0 -8 5 -16 14 -26z" fill="none" stroke="#dc2626" stroke-width="3.5"/>
      <path d="M19 18 c4 5 6 9 6 12 a6 6 0 0 1 -12 0 c0 -3 2 -7 6 -12z" fill="#dc2626" stroke="none"/>
      <text x="52" y="16" font-size="20">GPU-beschleunigt</text>
      <text x="52" y="40" font-size="16" font-weight="500" fill="#64748b">AMD ROCm · Ryzen AI Max+</text>
    </g>
    <line x1="1064" y1="784" x2="1064" y2="842" stroke="#e2e8f0" stroke-width="2"/>

    <!-- Sync -->
    <g transform="translate(1092,782)">
      <path d="M38 6 v12 h-12" fill="none" stroke="#0891b2" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M2 40 v-12 h12" fill="none" stroke="#0891b2" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M5 18 a16 16 0 0 1 30 -4 M35 28 a16 16 0 0 1 -30 4" fill="none" stroke="#0891b2" stroke-width="3.5" stroke-linecap="round"/>
      <text x="56" y="16" font-size="20">Vault-Sync</text>
      <text x="56" y="40" font-size="16" font-weight="500" fill="#64748b">Syncthing · alle Geräte</text>
    </g>
  </g>
</svg>
