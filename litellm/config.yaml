# LiteLLM-Konfiguration für den ROCm-Stack.
#
# Diese Datei legt die "Start-Modelle" fest. Weitere Ollama-Modelle werden
# automatisch per scripts/sync-ollama-models.sh nachgetragen (das Install-Skript
# ruft es auf), sodass alles, was du mit `ollama pull` lädst, hier auftaucht.
#
# api_base zeigt auf den Ollama-Container im gemeinsamen Docker-Netz.
#
# WICHTIG - warum "openai/…" statt "ollama/…": LiteLLMs eigener "ollama"-
# Provider übersetzt Werkzeugaufrufe (tool_calls) nicht zuverlässig - Ollama
# selbst liefert sie korrekt strukturiert (direkt gegen Ollama getestet,
# sowohl über /api/chat als auch /v1/chat/completions), aber bei LiteLLMs
# "ollama/"-Route kommt beim Client (LibreChat, Open WebUI) nur noch der
# rohe JSON-Text an, kein echter Funktionsaufruf. Über Ollamas OpenAI-
# kompatiblen Endpunkt (api_base mit "/v1") funktioniert es zuverlässig -
# das ist der ausführlich getestete, weit verbreitete Weg. api_key ist ein
# Platzhalter: Ollamas /v1-Endpunkt prüft ihn nicht, LiteLLMs "openai"-
# Provider verlangt aber irgendeinen nicht-leeren Wert.

model_list:
  - model_name: gemma4:12b
    litellm_params:
      model: openai/gemma4:12b
      api_base: http://ollama:11434/v1
      api_key: "ollama"

  - model_name: gemma3:12b
    litellm_params:
      model: openai/gemma3:12b
      api_base: http://ollama:11434/v1
      api_key: "ollama"

  - model_name: llama3.1:8b
    litellm_params:
      model: openai/llama3.1:8b
      api_base: http://ollama:11434/v1
      api_key: "ollama"

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL

litellm_settings:
  drop_params: true

# MCP Gateway (Werkzeuge: Dateisystem, Web-Fetch, GitHub, Suche, Datenbanken).
# Der API-Key wird von scripts/wire-mcp.sh nach dem ersten Start automatisch
# ausgelesen und als MCP_API_KEY in die .env geschrieben (siehe dort).
#
# code_sandbox: run_python/run_shell in isolierten Wegwerf-Containern (siehe
# sandbox-mcp/). Nur intern erreichbar, kein API-Key nötig (kein Host-Port).
mcp_servers:
  mcp_gateway:
    url: "http://mcp:3000/mcp"
    transport: "http"
    auth_type: "bearer_token"
    auth_value: os.environ/MCP_API_KEY

  code_sandbox:
    url: "http://sandbox-mcp:8000/mcp"
    transport: "http"
