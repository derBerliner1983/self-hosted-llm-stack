# LibreChat-Konfiguration für diesen Stack.
#
# Zwei Dinge werden hier verdrahtet:
#
#   1. endpoints.custom -> LiteLLM. LibreChat bekommt also dieselben Modelle
#      wie Open WebUI, über dasselbe Gateway (Schlüssel, Limits, Verbrauch
#      bleiben an einer Stelle).
#
#   2. mcpServers -> unsere MCP-Dienste, DIREKT. Das ist der eigentliche
#      Unterschied zu Open WebUI: LibreChat spricht MCP nativ, der Umweg
#      über mcpo (MCP -> OpenAPI) entfällt komplett. Damit fallen auch die
#      typischen mcpo-Stolpersteine weg - insbesondere die abgerissene
#      Session nach einem Neustart von mcp ("MCP session is not available").
#
# Nach jeder Änderung an dieser Datei LibreChat neu starten:
#   docker compose -f docker-compose.rocm.yml restart librechat

version: 1.2.8
cache: true

interface:
  # Die librechat.yaml ist die Wahrheit; Nutzer sollen Endpunkte nicht
  # versehentlich in der Oberfläche überschreiben.
  endpointsMenu: true
  modelSelect: true
  parameters: true
  sidePanel: true
  presets: true
  prompts: true
  bookmarks: true
  multiConvo: true
  agents: true

endpoints:
  custom:
    - name: "LiteLLM"
      # Containerinterner Name - LibreChat und LiteLLM liegen im selben
      # Docker-Netz, der veröffentlichte Port wird nicht gebraucht.
      baseURL: "http://litellm:4000/v1"
      apiKey: "${LITELLM_MASTER_KEY}"
      # "fetch: true" holt die Modellliste zur Laufzeit von LiteLLM - neue
      # Modelle tauchen dadurch automatisch auf, ohne diese Datei zu ändern.
      models:
        default: ["ollama/llama3.1:8b"]
        fetch: true
      titleConvo: true
      titleModel: "current_model"
      modelDisplayLabel: "LiteLLM (lokal)"
      # Symbol des ENDPUNKTS (gilt fuer alle Modelle darunter). Entweder eine
      # eigene Datei oder der Name eines mitgelieferten Symbols ("openAI",
      # "google", "anthropic" ...). Eigene Bilder gehoeren ins Volume
      # librechat-data, das im Container unter /app/client/public/images
      # haengt - LibreChat liefert sie dann unter /images/<datei> aus:
      #   docker cp logo.png librechat:/app/client/public/images/logo.png
      # iconURL: "/images/litellm.png"

  # Schritte, die ein Agent (android_build, code_sandbox, mcp_gateway...) in
  # einem Durchlauf machen darf, bevor LibreChat abbricht. Der eingebaute
  # Standard (25, je nach Version teils hoeher) reicht fuer etwas wie "baue
  # mir eine Android-App" nicht - jeder Werkzeugaufruf zaehlt als Schritt,
  # und ein Android-Projekt anlegen + mehrere Dateien schreiben + Gradle
  # bauen kommt schnell auf mehrere Dutzend. Ohne diese Zeile bricht so ein
  # Auftrag mittendrin ab: "Recursion limit of N reached without hitting a
  # stop condition." recursionLimit ist der Wert, mit dem ein neuer Chat
  # startet; maxRecursionLimit die Obergrenze, bis zu der du ihn in der
  # Oberflaeche selbst (pro Unterhaltung, unter den erweiterten Parametern
  # des Agenten) noch hochstellen kannst, ohne diese Datei zu aendern.
  agents:
    recursionLimit: 100
    maxRecursionLimit: 200

# ── Symbole und Namen je MODELL ─────────────────────────────────────────
# Anders als Open WebUI kennt LibreChat kein Bearbeiten-Fenster pro Modell -
# es steht hier. Jeder Eintrag unter "list" ist ein Steckbrief mit eigenem
# Namen, Symbol und Beschreibung; "preset.model" sagt, welches Modell wirklich
# dahintersteckt.
#
# Bilder: einfach ins Verzeichnis ./images legen (neben dieser Datei, eine
# Ebene hoeher). Sie sind dann unter /images/custom/<datei> erreichbar.
#
#   enforce: false   -> die vollstaendige Modellliste bleibt zusaetzlich waehlbar
#   prioritize: true -> die Steckbriefe stehen oben in der Auswahl
#
# Die Modellnamen unter "model" muessen exakt so heissen wie in deiner
# LiteLLM-Liste. Nachsehen:
#   docker exec litellm curl -s http://127.0.0.1:4000/v1/models \
#     -H "Authorization: Bearer $LITELLM_MASTER_KEY" | grep -o '"id":"[^"]*"'
#
# Nach Aenderungen: docker compose -f docker-compose.rocm.yml restart librechat
modelSpecs:
  enforce: false
  prioritize: true
  list:
    - name: "gemma4"
      label: "Gemma 4 12B"
      description: "Allrounder fuer den Alltag · versteht auch Bilder"
      iconURL: "/images/custom/gemma-color.png"
      showIconInMenu: true
      showIconInHeader: true
      order: 1
      preset:
        endpoint: "LiteLLM"
        model: "ollama/gemma4:12b"

    - name: "gemma3"
      label: "Gemma 3 12B"
      description: "Vorgaenger, etwas genuegsamer · versteht auch Bilder"
      iconURL: "/images/custom/gemma-color.png"
      showIconInMenu: true
      showIconInHeader: true
      order: 2
      preset:
        endpoint: "LiteLLM"
        model: "ollama/gemma3:12b"

    - name: "qwen-coder"
      label: "Qwen Coder"
      description: "Fuer Code und Werkzeugaufrufe · KEIN Bildverstaendnis"
      iconURL: "/images/custom/qwen-color.png"
      showIconInMenu: true
      showIconInHeader: true
      order: 3
      preset:
        endpoint: "LiteLLM"
        model: "ollama/qwen3-coder-next:latest"

    - name: "llama31"
      label: "Llama 3.1 8B"
      description: "Klein und schnell · KEIN Bildverstaendnis"
      iconURL: "/images/custom/llama.png"
      showIconInMenu: true
      showIconInHeader: true
      order: 4
      preset:
        endpoint: "LiteLLM"
        model: "ollama/llama3.1:8b"

# ── SSRF-Ausnahme für die eigenen Dienste ───────────────────────────────
# Ohne diesen Block lehnt LibreChat die MCP-Server ab:
#   Domain "http://mcp:3000" is not allowed
#
# Grund: Ist keine Positivliste gesetzt, blockiert LibreChat vorsorglich jedes
# Ziel, das auf eine PRIVATE IP zeigt (Schutz vor SSRF). Docker-interne Namen
# wie mcp oder sandbox-mcp loesen genau dorthin auf - also auf 172.x - und
# fallen damit unter diesen Schutz.
#
# allowedAddresses ist die dafuer vorgesehene Ausnahmeliste: sie gilt NUR fuer
# privaten IP-Raum und muss host:port lauten, damit die Ausnahme auf genau
# einen Dienstport begrenzt bleibt statt auf den ganzen Rechner.
#
# Bewusst allowedAddresses und nicht allowedDomains: eine gesetzte
# allowedDomains-Liste schaltet den SSRF-Schutz komplett ab. So bleibt er
# aktiv und es sind exakt diese drei Ports ausgenommen.
mcpSettings:
  allowedAddresses:
    - "mcp:3000"
    - "sandbox-mcp:8000"
    - "android-mcp:8000"

# ── MCP-Werkzeuge, nativ ────────────────────────────────────────────────
# Dieselben Dienste, die Open WebUI über mcpo erreicht - hier direkt.
mcpServers:
  mcp_gateway:
    type: "streamable-http"
    url: "http://mcp:3000/mcp"
    headers:
      Authorization: "Bearer ${MCP_API_KEY}"
    # Ohne dieses Flag prueft LibreChat beim Start selbst, ob der Server
    # OAuth braucht - OHNE den obigen Header, weil es ja erst herausfinden
    # will, ob er noetig ist. Der Reverse Proxy vor MCPHub (Caddy) sichert
    # ausnahmslos ALLE Pfade unter Port 3000 mit dem Bearer-Key ab, auch die
    # .well-known-OAuth-Erkennungspfade - die unauthentifizierte Prüfung
    # bekommt dort also ein 401 statt eines sauberen 404 und haelt den
    # Server faelschlich fuer OAuth-pflichtig. Ergebnis ohne dieses Flag:
    # "OAuth Required: true", Capabilities/Tools bleiben "undefined" - der
    # Bearer-Key selbst funktioniert einwandfrei, nur die Erkennung irrt.
    requiresOAuth: false
    timeout: 60000
    serverInstructions: |
      Werkzeuge für Dateisystem (/vault = Wissensdatenbank, /workspace =
      Android-Projekte), Web-Abruf und exakte Zeitzonen. Nutze das
      Zeit-Werkzeug statt selbst zu rechnen.

  code_sandbox:
    type: "streamable-http"
    url: "http://sandbox-mcp:8000/mcp"
    timeout: 120000
    serverInstructions: |
      Code ausführen und testen. /work bleibt zwischen Aufrufen erhalten,
      /tmp nicht. Kein Netzwerk. Nutze run_script für mehrzeilige Skripte.

  android_build:
    type: "streamable-http"
    url: "http://android-mcp:8000/mcp"
    timeout: 1800000
    serverInstructions: |
      Android-Projekte anlegen, bauen und testen (Gradle, SDK). Der erste
      Build eines Projekts dauert mehrere Minuten.
