<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Stack · Status</title>
<style>
  :root {
    --bg: #f4f5f7;
    --surface: #ffffff;
    --border: #e2e5ea;
    --border-strong: #d3d8df;
    --text: #1f2328;
    --text-muted: #616a75;
    --icon-bg: #f0f2f5;
    --accent: #1f6feb;
    --online: #1a7f37;
    --warn: #9a6700;
    --offline: #cf222e;
    --shadow: 0 1px 2px rgba(16, 22, 26, 0.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --border: #262c36;
      --border-strong: #333b47;
      --text: #e6edf3;
      --text-muted: #8b949e;
      --icon-bg: #1c222b;
      --accent: #4493f8;
      --online: #3fb950;
      --warn: #d29922;
      --offline: #f85149;
      --shadow: none;
    }
  }
  :root[data-theme="light"] {
    --bg: #f4f5f7; --surface: #ffffff; --border: #e2e5ea; --border-strong: #d3d8df;
    --text: #1f2328; --text-muted: #616a75; --icon-bg: #f0f2f5; --accent: #1f6feb;
    --online: #1a7f37; --warn: #9a6700; --offline: #cf222e; --shadow: 0 1px 2px rgba(16,22,26,.05);
  }
  :root[data-theme="dark"] {
    --bg: #0d1117; --surface: #161b22; --border: #262c36; --border-strong: #333b47;
    --text: #e6edf3; --text-muted: #8b949e; --icon-bg: #1c222b; --accent: #4493f8;
    --online: #3fb950; --warn: #d29922; --offline: #f85149; --shadow: none;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    font-size: 14px;
    line-height: 1.5;
  }
  .wrap { max-width: 960px; margin: 0 auto; padding: 32px 20px 64px; }

  header {
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; padding-bottom: 18px; margin-bottom: 24px;
    border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .brand .logo {
    width: 34px; height: 34px; flex: none; border-radius: 8px;
    background: var(--icon-bg); border: 1px solid var(--border);
    display: grid; place-items: center; color: var(--text-muted);
  }
  .brand h1 { font-size: 17px; font-weight: 600; letter-spacing: -0.01em; margin: 0; }
  .brand p { margin: 0; font-size: 12.5px; color: var(--text-muted); }
  .summary {
    display: inline-flex; align-items: center; gap: 8px; flex: none;
    padding: 6px 12px; border: 1px solid var(--border); border-radius: 6px;
    background: var(--surface); font-size: 12.5px; color: var(--text-muted);
    font-variant-numeric: tabular-nums;
  }
  .summary .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-muted); }

  .grid {
    display: grid; gap: 12px;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  }
  .card {
    display: block; text-decoration: none; color: inherit;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 16px; box-shadow: var(--shadow);
    transition: border-color .15s ease;
  }
  a.card:hover { border-color: var(--border-strong); }
  a.card:hover .open { color: var(--accent); }
  .card.disabled { cursor: default; }

  .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .idlabel { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .icon {
    width: 36px; height: 36px; flex: none; border-radius: 8px;
    background: var(--icon-bg); border: 1px solid var(--border);
    display: grid; place-items: center; color: var(--text-muted);
  }
  .icon svg { width: 19px; height: 19px; }
  .name { font-size: 15px; font-weight: 600; letter-spacing: -0.005em; }
  .desc { font-size: 12.5px; color: var(--text-muted); margin-top: 1px; }

  .status {
    display: inline-flex; align-items: center; gap: 6px; flex: none;
    font-size: 12px; font-weight: 500; color: var(--text-muted); white-space: nowrap;
  }
  .led { width: 8px; height: 8px; border-radius: 50%; background: var(--offline); flex: none; }
  .led.online { background: var(--online); }
  .led.warn { background: var(--warn); }
  .led.offline { background: var(--offline); }

  .foot {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border);
    font-size: 12.5px; color: var(--text-muted);
  }
  .port {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12px; color: var(--text-muted);
  }
  .open { color: var(--text-muted); font-weight: 500; transition: color .15s ease; }

  footer { margin-top: 28px; text-align: center; font-size: 12px; color: var(--text-muted); }
  .banner {
    display: none; margin-bottom: 18px; padding: 10px 14px; border-radius: 8px;
    background: color-mix(in srgb, var(--offline) 10%, transparent);
    border: 1px solid color-mix(in srgb, var(--offline) 35%, transparent);
    color: var(--offline); font-size: 13px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <span class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" width="19" height="19"><rect x="3" y="4" width="18" height="7" rx="1.5"/><rect x="3" y="13" width="18" height="7" rx="1.5"/><path d="M7 7.5h.01M7 16.5h.01"/></svg>
        </span>
        <div>
          <h1>Self-Hosted AI Stack</h1>
          <p>Dienststatus</p>
        </div>
      </div>
      <div class="summary"><span class="dot" id="metaDot"></span><span id="meta">Verbinde …</span></div>
    </header>

    <div class="banner" id="banner"></div>
    <div class="grid" id="grid"></div>

    <footer>Aktualisiert automatisch alle 5&nbsp;Sekunden</footer>
  </div>

<script>
  const grid = document.getElementById('grid');
  const meta = document.getElementById('meta');
  const metaDot = document.getElementById('metaDot');
  const banner = document.getElementById('banner');

  // Dezente, einfarbige Icons je Dienst (stroke = currentColor).
  const ICONS = {
    "open-webui": '<path d="M21 15a2 2 0 0 1-2 2H8l-4 4V5a2 2 0 0 1 2-2h13a2 2 0 0 1 2 2z"/>',
    "litellm":    '<rect x="3" y="4" width="18" height="7" rx="1.5"/><rect x="3" y="13" width="18" height="7" rx="1.5"/><path d="M7 7.5h.01M7 16.5h.01"/>',
    "ollama":     '<rect x="6" y="6" width="12" height="12" rx="1.5"/><path d="M9 2v2M15 2v2M9 20v2M15 20v2M2 9h2M2 15h2M20 9h2M20 15h2"/>',
    "whisper":    '<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',
    "embeddings": '<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.2-4.2"/>',
    "litellm-db": '<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>',
    "mcp":        '<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>',
    "sandbox-mcp":'<path d="M9 2v6L4 20a2 2 0 0 0 2 3h12a2 2 0 0 0 2-3l-5-12V2"/><path d="M9 2h6M6 15h12"/>',
    "mcpo":       '<rect x="4" y="9" width="16" height="9" rx="2"/><path d="M9 9V6a3 3 0 0 1 6 0v3"/><path d="M9 13h.01M15 13h.01"/>',
    "_default":   '<path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5"/>'
  };

  function esc(s) {
    return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  }
  function iconFor(container) {
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" '
      + 'stroke-linecap="round" stroke-linejoin="round">' + (ICONS[container] || ICONS._default) + '</svg>';
  }
  function statusOf(s) {
    if (s.online) return { cls: 'online', txt: 'Online' };
    if (s.health === 'unhealthy') return { cls: 'offline', txt: 'Fehler' };
    if (s.state === 'restarting') return { cls: 'warn', txt: 'Neustart …' };
    if (s.health === 'starting' || s.state === 'created') return { cls: 'warn', txt: 'Startet …' };
    if (s.state === 'absent') return { cls: 'offline', txt: 'Nicht vorhanden' };
    return { cls: 'offline', txt: 'Offline' };
  }

  function card(s) {
    const host = window.location.hostname || 'localhost';
    const clickable = s.online && s.port && s.path;
    const url = clickable ? `${window.location.protocol}//${host}:${s.port}${s.path}` : null;
    const tag = clickable ? 'a' : 'div';
    const attrs = clickable ? ` href="${esc(url)}" target="_blank" rel="noopener"` : '';
    const st = statusOf(s);
    const portLabel = s.port ? `:${s.port}` : 'intern';
    const openLabel = clickable ? '<span class="open">Öffnen →</span>' : '<span></span>';
    return `<${tag} class="card${clickable ? '' : ' disabled'}"${attrs}>
      <div class="top">
        <div class="idlabel">
          <span class="icon" aria-hidden="true">${iconFor(s.container)}</span>
          <div>
            <div class="name">${esc(s.label)}</div>
            <div class="desc">${esc(s.desc)}</div>
          </div>
        </div>
        <span class="status"><span class="led ${st.cls}"></span>${st.txt}</span>
      </div>
      <div class="foot"><span class="port">${portLabel}</span>${openLabel}</div>
    </${tag}>`;
  }

  async function tick() {
    try {
      const r = await fetch('/api/status', { cache: 'no-store' });
      const data = await r.json();
      grid.innerHTML = data.services.map(card).join('');
      const up = data.services.filter(s => s.online).length;
      const total = data.services.length;
      meta.textContent = `${up} / ${total} online · ${new Date().toLocaleTimeString('de-DE')}`;
      metaDot.style.background = up === total ? 'var(--online)' : (up === 0 ? 'var(--offline)' : 'var(--warn)');
      banner.style.display = data.docker_ok ? 'none' : 'block';
      if (!data.docker_ok) banner.textContent = 'Docker-Socket nicht erreichbar — Status kann nicht gelesen werden.';
    } catch (e) {
      meta.textContent = 'nicht erreichbar';
      metaDot.style.background = 'var(--offline)';
    }
  }
  tick();
  setInterval(tick, 5000);
</script>
</body>
</html>
