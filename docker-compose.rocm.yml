  mcp-shared:
    name: mcp-shared
  vault-data:
    name: vault-data
  vault-bridge-data:
    name: vault-bridge-data
  syncthing-config:
    name: syncthing-config
  sandbox-work:
    name: sandbox-work
  librechat-mongo:
    name: librechat-mongo
