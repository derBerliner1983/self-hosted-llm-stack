# Self-Hosted AI Stack — ROCm-Variante für AMD (z. B. Ryzen AI Max+ 395 / Strix Halo)
#
# Kompletter Stack, komplett auf Upstream-Images umgebaut:
#   Ollama (ROCm)  ·  Open WebUI  ·  LiteLLM  ·  PostgreSQL/pgvector
#   Whisper (STT)  ·  Embeddings (TEI)  ·  MCP Gateway (Werkzeuge)
#   Code-Sandbox  ·  mcpo (MCP→OpenAPI)  ·  Vault-Bridge (Obsidian/Nextcloud)
#   Dashboard (modernes UI)
#
# Start am einfachsten über ./install.sh (prüft Hardware, Firewall, Modell).
# Manuell:  docker compose -f docker-compose.rocm.yml up -d
#
# Werte kommen aus der .env-Datei (wird von install.sh erzeugt).

services:
  # ── LLM-Engine (AMD-GPU via ROCm) ──────────────────────────────────────────
  ollama:
    image: ollama/ollama:rocm
    container_name: ollama
    restart: always
    # AMD-GPU in den Container reichen:
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - "${VIDEO_GID:-44}"
      - "${RENDER_GID:-render}"
    security_opt:
      - seccomp:unconfined
    environment:
      # Strix Halo = gfx1151. Override hilft, falls ROCm die iGPU nicht direkt kennt.
      - HSA_OVERRIDE_GFX_VERSION=${HSA_OVERRIDE_GFX_VERSION:-11.5.1}
      # Modelle im GPU-Speicher halten (unified memory des 395 ist groß):
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-30m}
      - OLLAMA_HOST=0.0.0.0:11434
    ports:
      - "127.0.0.1:${PORT_OLLAMA:-11434}:11434/tcp"  # nur localhost; Zugriff via LiteLLM
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5

  # ── Datenbank (LiteLLM + Vektorspeicher via pgvector) ──────────────────────
  db:
    image: pgvector/pgvector:pg18-trixie
    container_name: litellm-db
    restart: always
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-litellm}
      POSTGRES_DB: litellm
    volumes:
      # postgres:18 legt PGDATA unter /var/lib/postgresql/18/docker ab und
      # deklariert /var/lib/postgresql als Volume — daher das ganze Verzeichnis
      # mounten (nicht /data), sonst startet der Container nicht sauber.
      - litellm-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── MCP Gateway (Werkzeuge: Dateisystem, Web-Fetch, Zeit, GitHub, Suche, DB) ─
  # Das "filesystem"-Werkzeug zeigt auf vault-data — dorthin synct vault-bridge
  # den Nextcloud/Obsidian-Vault. Sobald vault-bridge erfolgreich verbunden
  # hat, sieht dieses Werkzeug den Vault automatisch (gleiches Volume, kein
  # Neustart von mcp nötig). Details: README, "Vault-Bridge".
  #
  # MCP_VAULT_MOUNT_MODE steuert, ob die KI nur lesen (Standard "ro") oder
  # auch schreiben/löschen kann ("rw"). Schreibzugriff ist NUR sinnvoll,
  # wenn zusätzlich in der Vault-Bridge-Oberfläche "Zwei-Wege-Sync" aktiviert
  # ist - sonst überschreibt der nächste automatische Einweg-Sync von
  # Nextcloud alles, was die KI lokal geschrieben hat, kommentarlos wieder.
  #
  # ./mcp-tools:/opt/mcp-tools:ro bindet unser eigenes "time"-Werkzeug ein
  # (mcp-tools/get_time.py) - siehe README, Abschnitt "Zeit-Werkzeug". Das
  # Image selbst registriert weder "filesystem" noch "time" zuverlässig
  # automatisch (siehe scripts/wire-mcp.sh) - beides wird dort nachgetragen.
  mcp:
    image: hwdsl2/mcp-gateway
    container_name: mcp
    restart: always
    environment:
      - MCP_SERVERS=${MCP_SERVERS:-fetch,filesystem}
      - MCP_FILESYSTEM_DIRS=${MCP_FILESYSTEM_DIRS:-/vault,/workspace}
    # Port 3000 bedient zweierlei:
    #   1. die MCPHub-Weboberfläche - dort lassen sich MCP-Server ansehen,
    #      ein-/ausschalten und neue hinzufügen (Hot-Reload, kein Neustart
    #      nötig); Login mit dem 'admin'-Benutzer aus mcp_settings.json
    #   2. den MCP-Endpunkt /mcp für direkte MCP-Clients (Claude Desktop,
    #      Cursor, ...), abgesichert über den Bearer-Key aus der .env
    # install.sh gibt den Port nur fürs LAN frei.
    ports:
      - "${PORT_MCP:-3000}:3000/tcp"
    volumes:
      - mcp-data:/var/lib/mcp
      - mcp-shared:/var/lib/mcp-shared
      - vault-data:/vault:${MCP_VAULT_MOUNT_MODE:-ro}
      # Android-Projektquellen: read-write, damit die Dateisystem-Werkzeuge
      # den Code bearbeiten können, den android-mcp anschließend baut.
      # Damit der filesystem-Server dieses Verzeichnis auch tatsächlich
      # freigibt, trägt scripts/wire-mcp.sh es mit ein.
      - android-workspace:/workspace
      - ./mcp-tools:/opt/mcp-tools:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:3000/health"]
      interval: 15s
      timeout: 3s
      start_period: 60s
      retries: 3

  # ── Vault-Bridge (Nextcloud/Obsidian-Vault → MCP-Dateisystem-Werkzeug) ──────
  # ⚠️  Speichert Nextcloud-Zugangsdaten im eigenen Volume (vault-bridge-data).
  #     Das App-Passwort wird vor dem Schreiben mit `rclone obscure`
  #     verschleiert — das ist KEINE echte Verschlüsselung. Nutze unbedingt
  #     ein dediziertes Nextcloud-App-Passwort (Profil -> Sicherheit), nie
  #     das Hauptpasswort. Web-UI zum Verbinden/Konfigurieren: siehe
  #     PORT_VAULT_BRIDGE bzw. den Link im Dashboard.
  #     Bewusst wie Dashboard/Open WebUI/LiteLLM auf allen Interfaces
  #     erreichbar (nicht nur localhost) — sonst kein Browser-Zugriff vom
  #     LAN aus möglich. install.sh öffnet PORT_VAULT_BRIDGE in der Firewall
  #     im selben Umfang (LAN-Subnetz bzw. alle, je nach Firewall-Modus).
  vault-bridge:
    build: ./vault-bridge
    container_name: vault-bridge
    restart: always
    ports:
      - "${PORT_VAULT_BRIDGE:-8700}:8080/tcp"
    volumes:
      - vault-bridge-data:/data
      - vault-data:/vault
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')\" || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3

  # ── Syncthing (Obsidian-Vault direkt Windows/Mac/Linux <-> MCP-Dateisystem) ──
  # Alternative zur Vault-Bridge (Nextcloud+rclone bisync) für den Vault-Sync:
  # Läuft direkt zwischen deinen Geräten, ohne Nextcloud als Umweg - kein
  # Konflikt mehr mit einem parallel laufenden Nextcloud-Client auf demselben
  # Ordner. Teilt sich dasselbe vault-data-Volume wie die Vault-Bridge, damit
  # das MCP-Gateway-Dateisystem-Werkzeug ohne Änderung weiter funktioniert -
  # nutze nur eins von beiden gleichzeitig für denselben Ordner (siehe README,
  # Abschnitt "Syncthing").
  #
  # ⚠️  Web-Oberfläche (PORT_SYNCTHING_GUI) hat standardmäßig KEIN Passwort -
  #     nach dem ersten Start sofort unter Einstellungen -> GUI eins setzen.
  #     22000 (Sync) und 21027/udp (lokale Geräte-Erkennung im LAN) müssen für
  #     deine anderen Geräte erreichbar sein - install.sh öffnet das mit.
  syncthing:
    image: syncthing/syncthing
    container_name: syncthing
    restart: always
    hostname: ai-server
    environment:
      # root, damit Syncthing dieselben (root-eigenen) Dateien in vault-data
      # lesen/schreiben kann wie mcp/vault-bridge - Standard des Images wäre
      # UID/GID 1000, das hier keine Rechte auf dem geteilten Volume hätte.
      - PUID=0
      - PGID=0
    volumes:
      - syncthing-config:/var/syncthing/config
      - vault-data:/var/syncthing/vault
    ports:
      - "${PORT_SYNCTHING_GUI:-8384}:8384/tcp"
      - "22000:22000/tcp"
      - "22000:22000/udp"
      - "21027:21027/udp"
    healthcheck:
      test: ["CMD-SHELL", "curl -fkLsS -m 2 127.0.0.1:8384/rest/noauth/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3

  # ── Code-Sandbox (MCP-Werkzeuge: run_python/run_shell in Wegwerf-Containern) ─
  # ⚠️  Braucht Zugriff auf den Docker-Socket, um pro Ausführung einen frischen,
  #     isolierten Container zu starten und danach zu löschen (kein Netzwerk,
  #     read-only, Ressourcen-Limits, kein root — siehe sandbox-mcp/server.py).
  #     Nur intern erreichbar, kein Host-Port. Details: README, "Code-Sandbox".
  sandbox-mcp:
    # NUR "build:", kein "image:"-Tag: Ein zusätzlicher image-Tag ließ Docker
    # Compose bei "up -d" fälschlich versuchen, "ai-stack/sandbox-mcp" von
    # einer Registry zu ZIEHEN (sieht aus wie ein normaler Docker-Hub-Name),
    # statt lokal aus ./sandbox-mcp zu BAUEN — das schlug fehl ("pull access
    # denied", da dieses Image nirgends veröffentlicht ist). Compose vergibt
    # ohne image: automatisch einen lokalen Namen und baut immer lokal.
    build: ./sandbox-mcp
    container_name: sandbox-mcp
    restart: always
    environment:
      - SANDBOX_IMAGE=${SANDBOX_IMAGE:-python:3.12-slim}
      - SANDBOX_DEFAULT_TIMEOUT=${SANDBOX_DEFAULT_TIMEOUT:-15}
      - SANDBOX_MAX_TIMEOUT=${SANDBOX_MAX_TIMEOUT:-60}
      - SANDBOX_MEM_LIMIT=${SANDBOX_MEM_LIMIT:-256m}
      - SANDBOX_TMPFS_SIZE=${SANDBOX_TMPFS_SIZE:-64m}
      - SANDBOX_NETWORK=${SANDBOX_NETWORK:-none}
      - SANDBOX_WORK_VOLUME=${SANDBOX_WORK_VOLUME:-sandbox-work}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Persistenter Arbeitsbereich der Sandbox. Hier ebenfalls eingehängt,
      # damit der Dienst (läuft als root) beim Start die Schreibrechte für
      # die Wegwerf-Container setzen kann, die als 'nobody' laufen.
      - sandbox-work:/work
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; socket.create_connection(('127.0.0.1',8000),3)\" || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3

  # ── Open Interpreter (CLI, optional) ───────────────────────────────────────
  # Kein Dienst, sondern ein Kommandozeilen-Werkzeug: Du beschreibst eine
  # Aufgabe, das Modell schreibt Code und führt ihn aus.
  #
  # "profiles: [cli]" sorgt dafür, dass 'docker compose up -d' diesen Container
  # NICHT startet - er würde sonst dauerhaft laufen und auf eine Eingabe warten,
  # die nie kommt. Gestartet wird er nur auf Zuruf:
  #
  #   ./scripts/interpreter.sh          (oder im Menü: Open Interpreter -> Starten)
  #
  # Bewusst im Container: Open Interpreter führt aus, was das Modell schreibt.
  # Auf dem Host wäre das Zugriff auf alles, was dein Benutzer darf; hier sieht
  # es nur /work. Wer mehr braucht, hängt gezielt weitere Verzeichnisse ein -
  # den Vault am besten :ro, damit die Wissensdatenbank sauber bleibt.
  interpreter:
    profiles: ["cli"]
    build:
      context: ./interpreter
      args:
        OPEN_INTERPRETER_VERSION: ${OPEN_INTERPRETER_VERSION:-0.4.3}
    container_name: interpreter
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-}
      - INTERPRETER_API_BASE=${INTERPRETER_API_BASE:-http://litellm:4000/v1}
      - INTERPRETER_MODEL=${INTERPRETER_MODEL:-ollama/gemma3:12b}
      - INTERPRETER_CONTEXT_WINDOW=${INTERPRETER_CONTEXT_WINDOW:-16384}
      - INTERPRETER_MAX_TOKENS=${INTERPRETER_MAX_TOKENS:-4096}
    volumes:
      # Derselbe Arbeitsbereich wie die Code-Sandbox: was das LLM im Chat
      # angelegt hat, findest du hier wieder - und umgekehrt.
      - sandbox-work:/work
    # Interaktives Terminal - sonst bricht die Eingabeaufforderung sofort ab.
    stdin_open: true
    tty: true

  # ── LibreChat (Alternative zu Open WebUI, zum Vergleichen) ─────────────────
  # Beide Oberflächen können parallel laufen und nutzen dasselbe LiteLLM -
  # gleiche Modelle, gleiche Schlüssel, gleicher Verbrauch.
  #
  # Der interessante Unterschied: LibreChat spricht MCP NATIV. Die
  # Werkzeugdienste stehen in librechat/librechat.yaml direkt drin, der
  # Umweg über mcpo (MCP -> OpenAPI) entfällt - und mit ihm dessen
  # Stolpersteine, etwa die abgerissene Session nach einem mcp-Neustart.
  #
  # Wer LibreChat nicht braucht, kann diesen Dienst samt librechat-mongo
  # und den beiden Volumes ersatzlos streichen.
  librechat:
    image: registry.librechat.ai/danny-avila/librechat-dev:latest
    container_name: librechat
    restart: always
    ports:
      - "${PORT_LIBRECHAT:-3080}:3080/tcp"
    environment:
      - HOST=0.0.0.0
      - PORT=3080
      - MONGO_URI=mongodb://librechat-mongo:27017/LibreChat
      - CONFIG_PATH=/app/librechat.yaml
      # Verschlüsselung gespeicherter Zugangsdaten und Sitzungen. LibreChat
      # bricht beim Start ab, wenn Länge/Format nicht stimmen: CREDS_KEY
      # braucht 64 Hex-Zeichen, CREDS_IV 32. install.sh erzeugt beides.
      - CREDS_KEY=${LIBRECHAT_CREDS_KEY:-}
      - CREDS_IV=${LIBRECHAT_CREDS_IV:-}
      - JWT_SECRET=${LIBRECHAT_JWT_SECRET:-}
      - JWT_REFRESH_SECRET=${LIBRECHAT_JWT_REFRESH_SECRET:-}
      # Meilisearch ist nicht Teil dieses Stacks - Suche daher aus, sonst
      # protokolliert LibreChat dauerhaft Verbindungsfehler.
      - SEARCH=false
      # Werden in librechat.yaml als ${...} eingesetzt.
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-}
      - MCP_API_KEY=${MCP_API_KEY:-}
      # Registrierung offen lassen, damit du den ersten Account anlegen
      # kannst; danach in der .env auf false setzen.
      - ALLOW_REGISTRATION=${LIBRECHAT_ALLOW_REGISTRATION:-true}
    volumes:
      - ./librechat/librechat.yaml:/app/librechat.yaml:ro
      - librechat-data:/app/client/public/images
      - librechat-uploads:/app/uploads
    depends_on:
      librechat-mongo:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3080/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3

  librechat-mongo:
    image: mongo:8.0.20
    container_name: librechat-mongo
    restart: always
    command: mongod --quiet --logpath /dev/null
    volumes:
      - librechat-mongo:/data/db

  # ── Android-Build-Umgebung (Gradle + Android SDK als MCP-Werkzeuge) ────────
  # Bewusst NICHT nach dem Wegwerf-Muster von sandbox-mcp gebaut: Android-
  # Builds brauchen Netzwerk (Gradle lädt Abhängigkeiten), einen persistenten
  # Cache und Laufzeiten in Minuten. Die Befehle laufen deshalb direkt in
  # diesem Container - der dafür auch keinen Docker-Socket braucht.
  #
  # Das Image ist groß (~6-8 GB, Android SDK) und der erste Bau dauert
  # entsprechend. Wer keine Android-Entwicklung braucht, kann diesen Dienst
  # ersatzlos streichen (dann auch den android_build-Eintrag in
  # mcpo/config.template.json entfernen).
  android-mcp:
    build: ./android-mcp
    container_name: android-mcp
    restart: always
    environment:
      - ANDROID_DEFAULT_TIMEOUT=${ANDROID_DEFAULT_TIMEOUT:-600}
      - ANDROID_MAX_TIMEOUT=${ANDROID_MAX_TIMEOUT:-1800}
      - ANDROID_COMPILE_SDK=${ANDROID_COMPILE_SDK:-34}
      - ANDROID_MIN_SDK=${ANDROID_MIN_SDK:-24}
    volumes:
      # Projektquellen. Dasselbe Volume hängt read-write im mcp-Container,
      # damit die Dateisystem-Werkzeuge den Code bearbeiten können.
      - android-workspace:/workspace
      # Gradle-Cache: ohne ihn lädt jeder Build alle Abhängigkeiten neu.
      - android-gradle:/gradle
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket; socket.create_connection(('127.0.0.1',8000),3)\" || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  # ── mcpo (MCP → OpenAPI-Proxy) ──────────────────────────────────────────────
  # Open WebUI spricht kein rohes MCP, nur OpenAPI. mcpo übersetzt mcp und
  # sandbox-mcp dafür. mcpo/config.json wird von scripts/wire-mcp.sh mit dem
  # echten MCP-API-Key gerendert (enthält vor dem ersten Wiring nur den
  # Platzhalter aus config.template.json). Nur intern erreichbar.
  mcpo:
    image: ghcr.io/open-webui/mcpo:main
    container_name: mcpo
    restart: always
    volumes:
      - ./mcpo/config.json:/config.json:ro
    # Port veröffentlicht, damit die mitgelieferte Swagger-Oberfläche
    # (/mcp_gateway/docs) im Browser erreichbar ist: dort siehst du alle
    # Werkzeuge, die den Modellen tatsächlich zur Verfügung stehen, mit
    # Parametern - und kannst sie direkt ausprobieren, ohne ein Modell
    # dazwischen. Nützlich, wenn ein Modell behauptet, ein Werkzeug gebe es
    # nicht. install.sh gibt den Port nur fürs LAN frei.
    ports:
      - "${PORT_MCPO:-8800}:8000/tcp"
    command: ["--config", "/config.json", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      mcp:
        condition: service_healthy
      sandbox-mcp:
        condition: service_healthy
      android-mcp:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/docs')\" || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3

  # ── AI-Gateway (routet zu Ollama, spricht OpenAI-Protokoll, bindet MCP an) ──
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: litellm
    restart: always
    ports:
      - "${PORT_LITELLM:-4000}:4000/tcp"
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-sk-1234}
      - DATABASE_URL=postgresql://litellm:${POSTGRES_PASSWORD:-litellm}@db:5432/litellm
      - STORE_MODEL_IN_DB=True
      # Vom mcp-Container erzeugter API-Key; wird von scripts/wire-mcp.sh nach dem
      # ersten Start in die .env geschrieben (siehe litellm/config.yaml: mcp_servers).
      - MCP_API_KEY=${MCP_API_KEY:-}
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    depends_on:
      ollama:
        condition: service_healthy
      db:
        condition: service_healthy
      mcp:
        condition: service_healthy
      sandbox-mcp:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness')\" || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 120s
      retries: 5

  # ── Chat-Oberfläche (ersetzt AnythingLLM) ──────────────────────────────────
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: always
    ports:
      - "${PORT_WEBUI:-3001}:8080/tcp"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OPENAI_API_BASE_URL=http://litellm:4000/v1
      - OPENAI_API_KEY=${LITELLM_MASTER_KEY:-sk-1234}
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:-changeme}
      - WEBUI_NAME=${WEBUI_NAME:-AI Stack}
      - ENABLE_OLLAMA_API=true
    volumes:
      - open-webui-data:/app/backend/data
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 5

  # ── Sprache → Text ─────────────────────────────────────────────────────────
  whisper:
    image: onerahmet/openai-whisper-asr-webservice:v1.8.2
    container_name: whisper
    restart: always
    ports:
      - "127.0.0.1:${PORT_WHISPER:-9000}:9000/tcp"
    environment:
      - ASR_MODEL=${WHISPER_MODEL:-base}
      - ASR_ENGINE=faster_whisper
    volumes:
      - whisper-data:/root/.cache

  # ── Text → Vektoren (Text Embeddings Inference) ────────────────────────────
  embeddings:
    # cpu-1.5 bundled an old hf-hub crate (0.3.2) that crashed on certain
    # huggingface.co CDN redirects with "relative URL without a base",
    # restart-looping instead of ever serving. Pinned to a newer release
    # where this is fixed (verified pullable; confirm it serves after deploy).
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9
    container_name: embeddings
    restart: always
    ports:
      - "127.0.0.1:${PORT_EMBEDDINGS:-8000}:80/tcp"
    environment:
      - HF_ENDPOINT=https://huggingface.co
    command: ["--model-id", "${EMBEDDINGS_MODEL:-BAAI/bge-small-en-v1.5}"]
    volumes:
      - embeddings-data:/data

  # ── Dashboard (klares, modernes UI; liest Docker-Socket read-only) ─────────
  # LITELLM_MASTER_KEY: registriert neu bei Ollama installierte Modelle im
  # Hintergrund automatisch bei LiteLLM ("ollama/<modell>"), damit sie ohne
  # manuelles scripts/sync-ollama-models.sh in Open WebUI (via LiteLLM,
  # inkl. MCP-Werkzeugen) auftauchen. Siehe README, "Modelle bei LiteLLM
  # eintragen".
  dashboard:
    image: python:3.12-slim
    container_name: ai-stack-dashboard
    restart: always
    ports:
      - "${PORT_DASHBOARD:-8600}:8080/tcp"
    environment:
      - DASHBOARD_PORT=8080
      - PORT_WEBUI=${PORT_WEBUI:-3001}
      - PORT_LITELLM=${PORT_LITELLM:-4000}
      - PORT_OLLAMA=${PORT_OLLAMA:-11434}
      - PORT_WHISPER=${PORT_WHISPER:-9000}
      - PORT_EMBEDDINGS=${PORT_EMBEDDINGS:-8000}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-}
      - PORT_VAULT_BRIDGE=${PORT_VAULT_BRIDGE:-8700}
      - PORT_SYNCTHING_GUI=${PORT_SYNCTHING_GUI:-8384}
      - PORT_MCPO=${PORT_MCPO:-8800}
      - PORT_MCP=${PORT_MCP:-3000}
      - PORT_LIBRECHAT=${PORT_LIBRECHAT:-3080}
    volumes:
      - ./dashboard:/app:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: ["python", "/app/app.py"]

# Netzwerk: MTU an die Host-MTU anpassbar. Hinter VPN/Cloud-Overlays hat der
# Host oft < 1500 (z. B. 1450/1420); ohne Anpassung laufen TLS-Handshakes aus
# Containern in Timeouts ("i/o timeout"). install.sh erkennt die Host-MTU und
# setzt DOCKER_MTU in der .env automatisch.
networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: "${DOCKER_MTU:-1500}"

